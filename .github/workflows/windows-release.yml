name: Windows executable and release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install pinned build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c requirements-release.txt -e ".[tests]" PyInstaller numpy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip freeze | Out-File -Encoding utf8 build-dependencies.txt
      - name: Tests
        shell: pwsh
        env:
          PYTHONPATH: src
        run: python -m pytest -q
      - name: Build standalone executable
        run: python scripts/build_windows.py
      - name: Smoke-test packaged GUI and local Windows synthesis
        shell: pwsh
        run: |
          $report = Join-Path $PWD "smoke-test.json"
          $process = Start-Process -FilePath ".\dist\VRChatSpeechAssistantDeluxe.exe" -ArgumentList @("--smoke-test", "`"$report`"") -PassThru
          if (-not $process.WaitForExit(180000)) { $process.Kill(); throw "Executable smoke test timed out" }
          if ($process.ExitCode -ne 0) { throw "Executable smoke test failed: $($process.ExitCode)" }
          if (-not (Test-Path $report)) { throw "Executable produced no smoke-test report" }
          $result = Get-Content $report | ConvertFrom-Json
          if ($result.gui -ne "passed" -or $result.sapi_wav -ne "passed") { throw "Incomplete smoke test" }
          Get-Content $report
      - name: Hash release asset
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/VRChatSpeechAssistantDeluxe.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  VRChatSpeechAssistantDeluxe.exe" | Out-File -Encoding ascii dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            dist/VRChatSpeechAssistantDeluxe.exe
            dist/SHA256SUMS.txt
            dist/THIRD_PARTY_NOTICES.txt
            smoke-test.json
            build-dependencies.txt
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: release-assets
      - name: Publish tested executable
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          test -f release-assets/dist/VRChatSpeechAssistantDeluxe.exe
          gh release create "$RELEASE_TAG" \
            release-assets/dist/VRChatSpeechAssistantDeluxe.exe \
            release-assets/dist/SHA256SUMS.txt \
            release-assets/dist/THIRD_PARTY_NOTICES.txt \
            release-assets/smoke-test.json \
            release-assets/build-dependencies.txt \
            --verify-tag --prerelease \
            --title "VRChat Speech Assistant Deluxe $RELEASE_TAG" \
            --notes-file RELEASE_NOTES.md
