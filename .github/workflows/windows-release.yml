name: Windows and Linux builds and release
on:
  push:
    tags: ['v*']
    branches: ['linux-support']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install pinned build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c requirements-release.txt -e ".[tests]" PyInstaller numpy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip freeze | Out-File -Encoding utf8 build-dependencies.txt
      - name: Tests
        shell: pwsh
        env:
          PYTHONPATH: src
        run: python scripts/run_tests_ci.py
      - name: Build standalone executable
        run: python scripts/build_windows.py
      - name: Smoke-test packaged GUI and local Windows synthesis
        shell: pwsh
        run: |
          $report = Join-Path $PWD "smoke-test.json"
          $process = Start-Process -FilePath ".\dist\VRChatSpeechAssistantDeluxe.exe" -ArgumentList @("--smoke-test", "`"$report`"") -PassThru
          $finished = $process.WaitForExit(180000)
          if (-not $finished) { $process.Kill() }
          if (Test-Path $report) {
            $smokeDetails = Get-Content $report -Raw
            Write-Output $smokeDetails
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## Packaged smoke report"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $smokeDetails
            if (-not $finished -or $process.ExitCode -ne 0) {
              Write-Output "::error title=Packaged smoke report::$smokeDetails"
            }
          }
          if (-not $finished) { throw "Executable smoke test timed out" }
          if ($process.ExitCode -ne 0) { throw "Executable smoke test failed: $($process.ExitCode)" }
          if (-not (Test-Path $report)) { throw "Executable produced no smoke-test report" }
          $result = Get-Content $report | ConvertFrom-Json
          if ($result.gui -ne "passed" -or $result.sapi_wav -ne "passed" -or $result.sapi_async_wav -ne "passed" -or $result.preview -ne "passed" -or $result.language_switch -ne "passed" -or $result.native_hotkeys -ne "passed" -or $result.responsive_ui -ne "passed" -or $result.pitch_saved -ne "passed" -or $result.history -ne "passed" -or $result.category_collapse -ne "passed" -or $result.ending_controls -ne "passed" -or $result.pronunciation -ne "passed" -or $result.upstream_catalogue -ne "passed" -or $result.polly_style_guard -ne "passed" -or $result.isolated_audio_probe -ne "passed" -or $result.soundboard -ne "passed" -or $result.semicolon_hotkey -ne "passed" -or $result.shortcut_recording -ne "passed" -or $result.wav_mp3_srt -ne "passed" -or $result.youtube_edge -ne "passed" -or $result.settings_store -ne "passed" -or $result.lazy_polly_sdk -ne "passed" -or $result.live_chatbox -ne "passed" -or $result.favorite_reactions -ne "passed" -or $result.chatbox_preview -ne "passed" -or $result.manual_chatbox_override -ne "passed") { throw "Incomplete smoke test" }
          Get-Content $report
      - name: Hash release asset
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/VRChatSpeechAssistantDeluxe.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  VRChatSpeechAssistantDeluxe.exe" | Out-File -Encoding ascii dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            dist/VRChatSpeechAssistantDeluxe.exe
            dist/SHA256SUMS.txt
            dist/THIRD_PARTY_NOTICES.txt
            smoke-test.json
            build-dependencies.txt
          if-no-files-found: error
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYGAME_HIDE_SUPPORT_PROMPT: '1'
      SDL_AUDIODRIVER: pulseaudio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install Linux audio and Qt dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev libasound2-plugins pulseaudio pulseaudio-utils xvfb libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxkbcommon-x11-0 libegl1 libgl1 libpulse-mainloop-glib0
      - name: Install pinned Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c requirements-release.txt -e ".[tests]" PyInstaller numpy
          python -m pip freeze > build-dependencies-linux.txt
      - name: Start isolated user audio server
        run: |
          task_runtime="$RUNNER_TEMP/deluxe-audio"
          mkdir -p "$task_runtime"
          chmod 700 "$task_runtime"
          echo "XDG_RUNTIME_DIR=$task_runtime" >> "$GITHUB_ENV"
          echo "PULSE_SERVER=unix:$task_runtime/pulse/native" >> "$GITHUB_ENV"
          XDG_RUNTIME_DIR="$task_runtime" pulseaudio --start --exit-idle-time=-1
      - name: Tests
        env:
          PYTHONPATH: src
        run: python scripts/run_tests_ci.py
      - name: Build portable Linux application
        run: python scripts/build_linux.py
      - name: Packaged GUI, SDL playback, virtual microphone and OSC smoke test
        run: |
          set -o pipefail
          xvfb-run -a env QT_DEBUG_PLUGINS=1 QT_QPA_PLATFORM=xcb dist/linux/VRChatSpeechAssistantDeluxe/VRChatSpeechAssistantDeluxe --smoke-test "$PWD/linux-smoke-test.json" 2>&1 | tee linux-smoke-output.txt
          cat linux-smoke-test.json
          python -c "import json; d=json.load(open('linux-smoke-test.json')); assert all(d.get(k)=='passed' for k in ('virtual_microphone','isolated_device_probe','real_sdl_to_virtual_microphone','gui_and_shared_controls','real_osc_udp')), d"
      - name: Publish safe failure details
        if: failure()
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('linux-smoke-test.json')
          if p.exists():
              text = p.read_text().replace('%', '%25').replace('\n', '%0A')
              print('::error title=Linux packaged smoke::' + text)
          log = Path('linux-smoke-output.txt')
          if log.exists():
              text = log.read_text(errors='replace')[-14000:].replace('%', '%25').replace('\n', '%0A')
              print('::error title=Linux Qt/audio output::' + text)
          PY
      - name: Hash Linux release asset
        run: |
          cd dist/linux
          sha256sum *.tar.gz > SHA256SUMS-linux.txt
          mv THIRD_PARTY_NOTICES.txt THIRD_PARTY_NOTICES-linux.txt
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: |
            dist/linux/*.tar.gz
            dist/linux/SHA256SUMS-linux.txt
            dist/linux/THIRD_PARTY_NOTICES-linux.txt
            linux-smoke-test.json
            build-dependencies-linux.txt
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: linux-x86_64
          path: release-assets-linux
      - name: Publish tested Windows and Linux applications
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          test -f release-assets/dist/VRChatSpeechAssistantDeluxe.exe
          gh release create "$RELEASE_TAG" \
            release-assets/dist/VRChatSpeechAssistantDeluxe.exe \
            release-assets/dist/SHA256SUMS.txt \
            release-assets/dist/THIRD_PARTY_NOTICES.txt \
            release-assets/smoke-test.json \
            release-assets/build-dependencies.txt \
            release-assets-linux/dist/linux/*.tar.gz \
            release-assets-linux/dist/linux/SHA256SUMS-linux.txt \
            release-assets-linux/dist/linux/THIRD_PARTY_NOTICES-linux.txt \
            release-assets-linux/linux-smoke-test.json \
            release-assets-linux/build-dependencies-linux.txt \
            --verify-tag --prerelease \
            --title "VRChat Speech Assistant Deluxe $RELEASE_TAG" \
            --notes-file RELEASE_NOTES.md
